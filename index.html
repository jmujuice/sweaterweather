<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<title>Weather</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F1EB; --card:#FFFFFF; --line:#E2DED3; --line2:#ECE8DE; --ink:#1B1E22; --ink2:#3E4248; --muted:#5B5F66;
  --slate:#3E5566; --rain:#1F5A8C; --rainBg:#E4ECF4; --sun:#A85A12; --sunBar:#D68A3C; --sunBg:#F1E6D6;
  --temp:#C9772B; --soft:#F8F6F1; --track:#C9C3B4; --chip:#F3F1EB; --segOn:#FFFFFF;
  --display:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --lab:64px; --col:54px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181B; --card:#1E2226; --line:#2E3338; --line2:#2A2F34; --ink:#ECEAE4; --ink2:#C9C6BE; --muted:#9EA3A9;
    --slate:#A9B8C4; --rain:#7DB3E3; --rainBg:#22313F; --sun:#E7A15A; --sunBar:#D68A3C; --sunBg:#3A2E22;
    --temp:#D68A3C; --soft:#23282D; --track:#4A5057; --chip:#262B30; --segOn:#3A4148;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums;line-height:1.4;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rain)}
:focus-visible{outline:2px solid var(--rain);outline-offset:2px;border-radius:6px}
h2{margin:0;font-family:var(--display);font-weight:600;font-size:18px}
.muted{color:var(--muted)}
.app{max-width:1280px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.place{display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:15px;font-weight:600;text-align:left;min-height:44px}
.place svg{flex-shrink:0}
.sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px}
.round,.pill{height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.round{width:44px}
.pill{padding:0 14px;font-size:14px;font-weight:500}
.round.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Location form */
.locform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.locform[hidden]{display:none}
.locform label{font-size:13px;color:var(--muted)}
.locrow{display:flex;gap:8px}
.locrow input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px}
.primary{height:44px;border:0;border-radius:10px;padding:0 16px;background:var(--rain);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.primary{color:#0E1A26}}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--rain);padding:8px 0;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center;min-height:44px}
.msg{margin:0;font-size:14px;color:var(--ink)}
.msg:empty{display:none}

.status{font-size:15px;color:var(--muted);padding:40px 4px;text-align:center}
.status:empty{display:none}
.status .primary{margin-top:14px}

/* Layout */
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;
  grid-template-areas:"now" "tiles" "wear" "hourly" "days"}
main[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 10px}
.cardhead span{font-size:12px;color:var(--muted)}

/* Now */
.now{grid-area:now;display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 0}
.nowlab{font-size:13px;display:none}
.bigt{font-family:var(--display);font-size:88px;line-height:.9;font-weight:600;letter-spacing:-3px}
.feels{font-size:15px;margin-top:4px}
.nowsrc{font-size:12px;color:var(--muted);margin-top:6px}
.feels b{font-weight:600}
.nowcond{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-bottom:4px;text-align:right;max-width:50%}
.nowcond span{font-size:14px;color:var(--slate)}

/* Tiles */
.tileswrap{grid-area:tiles;display:flex;flex-direction:column}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tv{font-family:var(--display);font-size:24px;font-weight:600}
.tv small{font-size:14px;font-weight:500}
.tv.r{color:var(--rain)} .tv.s{color:var(--sun)}
.ts{font-size:12px;color:var(--muted)}

/* Hourly */
.hourly{grid-area:hourly;display:flex;flex-direction:column;min-width:0}
.hourly .card{overflow:hidden}
.hscroll{overflow-x:auto;padding:10px 0 6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.hgrid{width:max-content;display:flex;flex-direction:column;padding-right:8px}
.hrow{display:grid;grid-template-columns:var(--lab) repeat(24,var(--col));align-items:center;border-bottom:1px solid var(--line2)}
.hrow:last-child{border-bottom:0}
.hrow.end{align-items:end}
.hlab{position:sticky;left:0;z-index:1;background:var(--card);align-self:stretch;display:flex;align-items:center;padding-left:12px;padding-right:6px;font-size:12px;color:var(--muted);border-right:1px solid var(--line2);line-height:1.3}
.hc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;scroll-snap-align:start}
.hc.mid{border-left:1px dashed var(--track)}
.hrow.head .hc{padding:0 0 8px}
.dmk{font-size:11px;font-weight:600;color:var(--rain);height:14px}
.ht{font-size:12px;font-weight:600;white-space:nowrap}
.hv{font-family:var(--display);font-size:18px;font-weight:600}
.fv{font-size:14px;color:var(--ink2)}
.wv{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:500}
.sm{font-size:11px;color:var(--muted)}
.sv{font-size:13px;font-weight:500;color:var(--sun)}
.sbar{width:32px;height:4px;border-radius:2px;background:var(--sunBg);position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--sunBar);border-radius:2px}
.vbar{width:20px;height:40px;border-radius:4px;background:var(--rainBg);position:relative;overflow:hidden}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--rain)}
.rv{font-size:13px;font-weight:500;color:var(--rain)}
.av{font-size:13px;color:var(--rain)}

/* What should I wear? */
.wear{grid-area:wear;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{margin:0;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.adj{height:44px;border:0;background:none;color:var(--ink2);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;margin:-8px -4px -8px 0}
.adj[aria-expanded="true"]{color:var(--rain)}
.wmain{display:flex;align-items:center;gap:14px}
.wicon{font-size:44px;line-height:1;flex-shrink:0;width:52px;text-align:center}
.wlabel{margin:0;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15}
.wclothes{margin:4px 0 0;font-size:15px;font-weight:500;color:var(--ink2)}
.wsum{margin:0;font-size:14px;line-height:1.5}
.walerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.walerts li{font-size:13px;line-height:1.45;color:var(--ink2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:3px;background:var(--chip);border-radius:12px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--segOn);color:var(--ink)}
.wpanel{border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.wrow{display:flex;flex-direction:column;gap:6px}
.wrow > span{font-size:12px;color:var(--muted)}
.wear.collapsed{padding-top:6px;padding-bottom:6px}

/* Days */
.days{grid-area:days;display:flex;flex-direction:column}
.dlist{display:flex;flex-direction:column}
.dhead{display:none}
.day{display:grid;grid-template-columns:104px 28px minmax(0,1fr);align-items:center;gap:10px;padding:14px 14px 12px;border-top:1px solid var(--line2)}
.day:first-child{border-top:0}
.dname{display:flex;flex-direction:column;gap:1px;min-width:0}
.dname b{font-size:15px;font-weight:600}
.dname .long{display:none}
.dname .c{font-size:12px;color:var(--muted)}
.dicon{display:flex;justify-content:center}
.drange{display:flex;align-items:center;gap:8px}
.drange .lo{font-size:14px;color:var(--muted);width:28px;text-align:right}
.drange .hi{font-family:var(--display);font-size:17px;font-weight:600;width:32px}
.rbar{flex:1;height:6px;border-radius:3px;background:var(--line2);position:relative}
.rbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--temp);min-width:6px}
.dmeta{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dm{display:flex;flex-direction:column;gap:1px;font-size:13px;font-weight:500;min-width:0}
.dm .ml{font-size:11px;color:var(--muted);font-weight:400}
.dm.s .v{color:var(--sun)} .dm.r .v{color:var(--rain)}
.pbar{display:none}

footer{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.6}

/* Desktop */
@media (min-width: 960px){
  :root{--lab:132px;--col:72px}
  .app{padding:36px 48px 48px;gap:24px}
  .place{font-size:20px;gap:8px}
  .sub{font-size:13px}
  main{grid-template-columns:380px minmax(0,1fr);gap:24px 24px;
    grid-template-areas:"now hourly" "tiles hourly" "wear wear" "days days"}
  h2{font-size:20px}
  .now{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .nowlab{display:block}
  .bigt{font-size:96px}
  .tileswrap .cardhead{display:none}
  .tiles{gap:12px}
  .tile{padding:14px 16px}
  .tv{font-size:26px}
  .hourly{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 0 12px;overflow:hidden}
  .hourly .cardhead{padding:0 24px 12px}
  .hourly .card{border:0;border-radius:0}
  .hlab{padding-left:24px;font-size:13px}
  .hv{font-size:22px} .fv{font-size:16px} .wv{font-size:15px} .sv,.rv,.av{font-size:14px} .sm{font-size:12px} .ht{font-size:13px}
  .sbar{width:44px} .vbar{width:26px;height:44px}
  .wear{padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 320px;column-gap:32px;row-gap:10px;
    grid-template-areas:"head head head" "main sum win" "main alerts win" "panel panel panel";align-items:start}
  .wear.collapsed{display:flex}
  .whead{grid-area:head} .wmain{grid-area:main} .wsum{grid-area:sum;font-size:15px} .walerts{grid-area:alerts} .wwin{grid-area:win}
  .wpanel{grid-area:panel;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:end}
  .wpanel .linkbtn{grid-column:1 / -1}
  .wicon{font-size:56px;width:64px} .wlabel{font-size:26px} .wclothes{font-size:16px}
  .walerts li{font-size:14px}
  .days{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px 8px}
  .days > .card{border:0;border-radius:0}
  .days .cardhead{padding:0 0 8px}
  .dhead,.day{display:grid;grid-template-columns:210px 40px minmax(0,1.6fr) 110px 130px 120px 160px;gap:16px;align-items:center}
  .dhead{padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
  .day{padding:12px 0;border-top:0;border-bottom:1px solid var(--line2)}
  .day:last-child{border-bottom:0}
  .dname .short{display:none} .dname .long{display:inline} .dname .c{font-size:13px}
  .drange{gap:12px} .drange .lo{font-size:15px;width:32px} .drange .hi{font-size:20px;width:38px}
  .dmeta{display:contents}
  .dm{font-size:14px;font-weight:400;flex-direction:row;align-items:center;gap:8px}
  .dm .ml{display:none}
  .dm.r .v{font-weight:500}
  .pbar{display:block;width:44px;height:6px;border-radius:3px;background:var(--rainBg);position:relative;overflow:hidden;flex-shrink:0}
  .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--rain)}
}
@media (prefers-reduced-motion: reduce){.round.spin svg{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <button type="button" class="place" id="placeBtn" aria-expanded="false" aria-controls="locForm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rain)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span id="placeName">Finding your location</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sub" id="updated"></div>
    </div>
    <div class="actions">
      <button type="button" class="pill" id="unitBtn">°F</button>
      <button type="button" class="round" id="refreshBtn" aria-label="Refresh forecast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <form class="locform" id="locForm" hidden novalidate>
    <p class="msg" id="locMsg" role="alert"></p>
    <label for="zip">Zip code</label>
    <div class="locrow">
      <input id="zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="20148">
      <button type="submit" class="primary">Show forecast</button>
    </div>
    <button type="button" class="linkbtn" id="geoBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>
      Use my current location
    </button>
  </form>

  <div class="status" id="status" role="status" aria-live="polite">Finding your location</div>

  <main id="main" hidden>
    <section class="now" id="now" aria-label="Current conditions"></section>
    <section class="tileswrap" aria-labelledby="n6h">
      <div class="cardhead"><h2 id="n6h">Next 6 hours</h2><span id="n6range"></span></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <section class="hourly" aria-labelledby="hh">
      <div class="cardhead"><h2 id="hh">Hourly</h2><span>Next 24 hours, scroll for more</span></div>
      <div class="card"><div class="hscroll" id="hourly" tabindex="0" aria-label="Hourly forecast table, scrolls sideways"></div></div>
    </section>
    <section class="card wear" id="wear" aria-label="What to wear"></section>
    <section class="days" aria-labelledby="dh">
      <div class="cardhead"><h2 id="dh">7-day forecast</h2><span>Low to high</span></div>
      <div class="card"><div class="dhead"><span>Day</span><span></span><span>Low to high</span><span>Feels like</span><span id="dhWind">Wind, mph</span><span>Sun and UV</span><span>Rain chance, amount</span></div><div class="dlist" id="days"></div></div>
    </section>
  </main>

  <footer id="foot"></footer>
</div>

<script src="js/solar.js"></script>
<script src="js/interpret.js"></script>
<script src="js/recommend.js"></script>
<script src="js/app.js"></script>
</body>
</html>
